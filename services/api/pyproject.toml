[project]
name = "brasaland-api"
version = "0.1.0"
description = "API central de Brasaland"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "python-multipart",
    "tinydb",
    "pydantic",
    "python-jose[cryptography]>=3.5.0",
    "libpass[bcrypt]>=1.9.4",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
seed = "seed:main"

[tool.setuptools]
py-modules = ["main", "models", "database", "seed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["routes*"]
